
name: Scrape and Save Playlist

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */2 * * *'

permissions:
  contents: write

concurrency:
  group: playlist-scraper
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 selenium

      - name: Check Python syntax
        run: python3 -m py_compile demo.py

      - name: Run actual scraper
        env:
          BASE_URL: https://pornhao.com
          MODEL_NAMES: violet-myers,candy-love
        run: |
          test -n "$BASE_URL" || {
            echo "ERROR: Set BASE_URL repository variable"
            exit 1
          }
          python3 demo.py --headless

      - name: Verify playlist data
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          p = Path("playlist.json")
          if not p.exists():
              raise SystemExit("ERROR: playlist.json not created")

          data = json.loads(p.read_text(encoding="utf-8"))

          if not isinstance(data, list) or not data:
              raise SystemExit("ERROR: no videos scraped")

          if not Path("playlist.m3u").exists():
              raise SystemExit("ERROR: playlist.m3u not created")

          print(f"SUCCESS: {len(data)} videos scraped")
          PY

      - name: Commit playlist to GitHub
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add playlist.json playlist.m3u

          if git diff --cached --quiet; then
            echo "No playlist changes"
          else
            git commit -m "Auto update video playlists"
            git push
          fi
