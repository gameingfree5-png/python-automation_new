
name: Scrape and Save Home Playlist

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */2 * * *'

permissions:
  contents: write

concurrency:
  group: playlist-scraper
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest

    timeout-minutes: 120

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 selenium

      - name: Check Python syntax
        run: |
          python3 -m py_compile demo.py

      - name: Run homepage scraper
        env:
          BASE_URL: https://pornhao.com
        run: |
          python3 demo.py \
            --headless \
            --max-pages 2 \
            --group-title "home" \
            --output-json playlist.json \
            --output-m3u playlist.m3u

      - name: Verify playlist data
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          json_path = Path("playlist.json")
          m3u_path = Path("playlist.m3u")

          if not json_path.exists():
              raise SystemExit("ERROR: playlist.json missing")

          if not m3u_path.exists():
              raise SystemExit("ERROR: playlist.m3u missing")

          data = json.loads(
              json_path.read_text(encoding="utf-8")
          )

          if not isinstance(data, list) or not data:
              raise SystemExit("ERROR: no homepage videos")

          required = {
              "model",
              "title",
              "page_url",
              "stream_url",
              "thumbnail",
              "qualities"
          }

          for index, item in enumerate(data, 1):
              missing = required - item.keys()

              if missing:
                  raise SystemExit(
                      f"Entry {index} missing: {missing}"
                  )

              if item["model"] != "home":
                  raise SystemExit(
                      f"Entry {index}: model is not home"
                  )

              if not item["stream_url"]:
                  raise SystemExit(
                      f"Entry {index}: empty stream"
                  )



          print(
              f"SUCCESS: {len(data)} homepage videos scraped"
          )
          PY

      - name: Commit playlist to GitHub
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add playlist.json playlist.m3u

          if git diff --cached --quiet; then
            echo "No playlist changes"
          else
            git commit -m "Auto update home playlist"
            git push
          fi
